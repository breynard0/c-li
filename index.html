<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
          rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet"/>
    <link rel="icon" type="image/svg" href="/logo-2.svg"/>
    <title>C-LI</title>
</head>
<body>
<main>
    <div class="greeter_box">
        <p id="green_arrow">></p>
        <div>
            <p id="initial_container">Welcome to C-LI, a Hack Club You Ship We Ship
                program where you earn your pick of a terminal-based video game for
                writing a command line application in C.</p>
            <p id="blink_container">Press [ENTER] or tap on your screen to continue</p>
            <p id="name_container" class="name_container_text_styling">A <a class="name_container_text_styling"
                                                                            href="https://hackclub.com/">Hack
                Club</a> program by <a class="name_container_text_styling"
                                       href="https://hackclub.slack.com/team/U08LEHUPSCR">Brendan</a></p>
        </div>
    </div>

    <div id="main_container">
        <div class="block_div">
            <h3 class="fill_in_text" text="So what can I make?"></h3>
            <p class="fill_in_text" text="Your project must be:"></p>
            <p class="fill_in_text" text="- Written in C"></p>
            <p class="fill_in_text" text="- Able to run in the terminal"></p>
            <p class="fill_in_text" text="- Able to be finished in the timeframe of C-LI"></p>
            <p class="fill_in_text" text="- Tracked using Hackatime and open source"></p>
            <p class="fill_in_text"
               text="Beyond that, anything goes! You can make it a call and response kind of thing,
                    where the user inputs something and your program prints something back. 
                    You could do it like a utility CLI app with arguments. 
                    If you're feeling crafty, take a stab at a TUI app! 
                    Just make sure you can finish it in time."></p>
        </div>
        <div class="block_div">
            <h3 class="fill_in_text" text="What prizes can I get?"></h3>
            <p class="fill_in_text"
               text="After submitting your project, you may pick from one of the following terminal-related games:"></p>
            <p class="fill_in_text" text="- Hacknet"></p>
            <p class="fill_in_text" text="- TIS-100"></p>
            <p class="fill_in_text" text="- MOLEK-SYNTEZ"></p>
            <p class="fill_in_text" text="- Duskers"></p>
            <p class="fill_in_text" text="- Move Code Lines"></p>
            <p class="fill_in_text" text="Got another terminal-related game? Propose it in #c-li!"></p>
        </div>
        <div class="block_div">
            <h3 class="fill_in_text" text="AI Policy and Quality Guidelines"></h3>
            <p class="fill_in_text"
               text="Given the small scope and technical nature of this program, no AI-generated code will be permitted."></p>
            <p class="fill_in_text"
               text="You may still use AI as a glorified search engine, but all critical thinking should be your own."></p>
            <p class="fill_in_text"
               text="C-LI has quality requirements rather than strict hour ones. 
               You'll certainly be spending at least an hour or two in order to 
               build something that shows the best of your abilities, but feel 
               free to take as much time as you need to polish your project into something you're truly proud of!"></p>
        </div>
        <div class="block_div">
            <h3 class="fill_in_text" text="I don't know what to make!"></h3>
            <p class="fill_in_text" text="Here are some project ideas:"></p>
            <p class="fill_in_text" text="- Guess-the-number game (maybe with some extra parameters)"></p>
            <p class="fill_in_text" text="- Command line calculator"></p>
            <p class="fill_in_text" text="- Little narrative story in your terminal"></p>
            <p class="fill_in_text" text="- An app that grabs a specific system diagnostic"></p>
            <p class="fill_in_text" text="- Terminal Pong, Snake, or something similar"></p>
        </div>
        <div class="block_div">
            <h3 class="fill_in_text" text="How do I submit?"></h3>
            <p class="fill_in_text"
               text="First, make sure your project has both a README and a downloadable executable for at least one platform (Windows, Linux, MacOS, etc).
               Unfortunately, only having instructions for building from source isn't enough here, you need an actual executable for one of those platforms in something like a Github Release."></p>
            <p class="fill_in_text"
               text="When you're done, complete this form here!"></p>
            <p class="fill_in_text" text="You will be contacted through Slack in order to fulfill your prize."></p>
            <p class="fill_in_text"
               text="As a 501(c)(3) nonprofit, Hack Club must collect your address in order to comply with US anti-terrorism laws."></p>
        </div>
        <div class="block_div">
            <img id="logo_img" src="logo.svg" alt="C-LI Logo"/>
        </div>
    </div>

    <div style="display: flex; margin-left: 1.3rem" id="legal_stuff">
        <a href="https://hackclub.com/privacy-and-terms">Hack Club Privacy and Terms</a>
        <div style="width: 10em"></div>
        <a href="https://forms.hackclub.com/bounty">Fulfillment Bounty</a>
    </div>

    <div id="countdown">
        00:00:00:00
    </div>
</main>
<script src="index.js"></script>
</body>
</html>
